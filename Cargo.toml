[package]
name = "provider-mock-service"
version = "0.1.0"
edition = "2024"
publish = false

# Solana crate versions match transaction-service exactly so both can share
# one build cache (`CARGO_TARGET_DIR`) and bincode formats are identical.
[dependencies]
axum = "0.8"
base64 = "=0.22.1"
bincode = "=1.3.3"
bs58 = "=0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-compute-budget-interface = "=2.2.2"
solana-hash = "=2.3.0"
solana-instruction = "=2.3.3"
solana-keypair = "=2.2.3"
solana-message = { version = "=2.4.0", features = ["bincode"] }
solana-pubkey = { version = "=2.4.0", features = ["std"] }
solana-signature = { version = "=2.3.0", features = ["std"] }
solana-signer = "=2.2.1"
solana-system-interface = { version = "=1.0.0", features = ["bincode"] }
solana-transaction = { version = "=2.2.3", features = ["bincode"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
